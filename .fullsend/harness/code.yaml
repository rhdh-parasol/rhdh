# Extend Fullsend's code agent with the RHDH Backstage upgrade workflow.
base: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/code.yaml#sha256=cfa49d4677cc4d6544fcf878e05b0f95620bbb62907289dbc5a22681a7679976

skills:
  - https://github.com/redhat-developer/rhdh-skills/tree/37a767651fea1317cf64a2849a2fd2c163620ec0/skills/plugins/rhdh-backstage-upgrade#sha256=96b158fdf11d61bdfb4d4e30a76fb6b1319af96a1ebc2f91204a92609155f09f

allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/
  - https://github.com/redhat-developer/rhdh-skills/

# Run 34879198625 (RHIDP-17140) was killed at the base harness's 35-minute
# default before it could commit. The install itself is not the slow part —
# fixing the Yarn/proxy gap (.yarnrc.yml) brings `yarn install` back under
# 5 minutes — but the full flow (bump, second install, tsc/build/test) left
# little headroom at 35. `timeout_minutes` is the knob the runner enforces
# and kills on; TIMEOUT_SECONDS is kept in sync so the agent's own budget
# arithmetic agrees with it. Per-iteration; the base's
# validation_loop.max_iterations: 2 makes worst case 120 minutes, still
# well under the 360-minute GitHub Actions job default.
timeout_minutes: 60

env:
  sandbox:
    TIMEOUT_SECONDS: "3600"
