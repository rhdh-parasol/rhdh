# Extend Fullsend's code agent with the RHDH Backstage upgrade workflow.
base: https://raw.githubusercontent.com/fullsend-ai/agents/dc7c805632ebb6b79a4b0890ef6da17fe8fc539d/harness/code.yaml#sha256=6493021f96431dc55b330d553c543b3c8463a1987c8f62e911b37286cadd855c

skills:
  - https://github.com/redhat-developer/rhdh-skills/tree/37a767651fea1317cf64a2849a2fd2c163620ec0/skills/plugins/rhdh-backstage-upgrade#sha256=96b158fdf11d61bdfb4d4e30a76fb6b1319af96a1ebc2f91204a92609155f09f

allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/
  - https://github.com/redhat-developer/rhdh-skills/

# A Backstage bump on this monorepo needs two full `yarn install` runs (once to
# get a working tree, once after the bump) plus a build, on a workspace set far
# larger than the base harness's 35-minute default was sized for. Run 34879198625
# was killed mid-install at that default and produced no PR.
#
# `timeout_minutes` is the knob the runner actually enforces; TIMEOUT_SECONDS is
# carried in the sandbox env and kept in sync so the agent budgets against the
# same number. Both are per-iteration, and the base sets
# validation_loop.max_iterations: 2, so worst case is 2x this — still well under
# the 360-minute GitHub Actions job default, which sets the real ceiling.
timeout_minutes: 90

env:
  sandbox:
    TIMEOUT_SECONDS: "5400"
