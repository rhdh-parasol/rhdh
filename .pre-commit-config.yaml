# Fullsend runs these hooks during output validation and again before publishing.
repos:
  - repo: local
    hooks:
      - id: yarn-lockfile-declarations
        name: Check Yarn workspace lockfile declarations
        entry: python3 scripts/check-yarn-lockfiles.py
        language: python
        additional_dependencies:
          - PyYAML==6.0.3
        pass_filenames: false
        always_run: true
