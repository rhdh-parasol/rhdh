name: Update Backstage

# Serialize issue creation across every ref in this repository.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Backstage release version (e.g., 1.2.3). Do not combine with pattern.'
        required: false
      pattern:
        description: |
          Specify a glob pattern to select packages for upgrade. Do not combine with release.
          For example, `@{backstage,backstage-community}/*`.
          To update all Backstage-related packages, use `@{backstage,backstage-community,janus-idp,roadiehq,immobiliarelabs,pagerduty,parfuemerie-douglas}/*`.
        required: false
  schedule:
    - cron: "15 3 * * WED" # Every Wednesday at 3:15 AM

jobs:
  create-issue:
    name: Create upgrade issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RHDH_GITHUB_APP_ID }}
          private-key: ${{ secrets.RHDH_GITHUB_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Create Backstage upgrade issue
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          INPUT_PATTERN: ${{ inputs.pattern }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_RELEASE" && -n "$INPUT_PATTERN" ]]; then
            echo "release and pattern are mutually exclusive" >&2
            exit 1
          fi

          release=${INPUT_RELEASE:-latest stable release}
          pattern=${INPUT_PATTERN:-all Backstage packages}
          request_key=$(
            printf 'release=%s\npattern=%s\n' "$INPUT_RELEASE" "$INPUT_PATTERN" |
              sha256sum |
              cut -d ' ' -f 1
          )
          request_marker="<!-- backstage-upgrade-request:$request_key -->"

          if [[ -n "$INPUT_RELEASE" ]]; then
            title="Upgrade Backstage to $INPUT_RELEASE"
          elif [[ -n "$INPUT_PATTERN" ]]; then
            title="Upgrade Backstage dependencies matching $INPUT_PATTERN"
          else
            title="Upgrade Backstage to the latest stable release"
          fi

          ensure_label() {
            local name=$1
            local description=$2
            local color=$3
            gh label create "$name" \
              --repo "$GITHUB_REPOSITORY" \
              --description "$description" \
              --color "$color" \
              --force
          }

          ensure_label \
            backstage-upgrade \
            "Backstage dependency upgrade handled by Fullsend" \
            "1D76DB"
          ensure_label \
            backstage-upgrade-automation \
            "Backstage upgrade request created by automation" \
            "BFDADC"
          ensure_label \
            ready-for-triage \
            "Triggers triage agent dispatch" \
            "0E8A16"

          existing_issue=$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label backstage-upgrade-automation \
              --limit 1000 \
              --json body,number |
              jq -r --arg marker "$request_marker" \
                'first(.[] | select(.body | contains($marker)) | .number) // empty'
          )
          if [[ -n "$existing_issue" ]]; then
            gh issue edit "$existing_issue" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label backstage-upgrade,backstage-upgrade-automation,ready-for-triage
            echo "Reconciled existing request: https://github.com/$GITHUB_REPOSITORY/issues/$existing_issue"
            exit 0
          fi

          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<EOF
          $request_marker
          <!-- issue-template: backstage-upgrade.yml -->
          ## Backstage release

          $release

          ## Dependency pattern

          $pattern

          ## Implementation

          Use \`/rhdh-backstage-upgrade\` to update this RHDH checkout from \`main\`. Follow the skill's RHDH monorepo path, preserve this repository's dependency range conventions, complete the required migrations, and run every repository-specific verification check before opening the pull request.

          ## Completion criteria

          - [ ] The requested Backstage dependencies are updated.
          - [ ] Required source migrations are complete.
          - [ ] The verification commands required by \`/rhdh-backstage-upgrade\` pass.
          - [ ] The pull request links this issue.
          EOF

          issue_url=$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file "$body" \
            --label backstage-upgrade \
            --label backstage-upgrade-automation \
            --label ready-for-triage)

          echo "Created $issue_url"
