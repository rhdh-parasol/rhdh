nodeLinker: node-modules

# Yarn 4.17+ defaults enableScripts to false; native deps (better-sqlite3) need builds.
enableScripts: true

npmPreapprovedPackages:
  - "@backstage/*"

yarnPath: .yarn/releases/yarn-4.17.1.cjs

# Yarn Berry does not read HTTP_PROXY/HTTPS_PROXY on its own (npm does, via
# NODE_USE_ENV_PROXY=1) — it only honours httpProxy/httpsProxy here or
# YARN_HTTP_PROXY/YARN_HTTPS_PROXY. Sandboxed CI environments that route
# egress through a proxy (e.g. Fullsend) need this bridge, or `yarn install`
# has no route out while npm does (RHIDP-17140). A no-op everywhere else:
# Yarn's ${NAME:-} expansion falls back to an empty string when the
# variable is unset, which Yarn treats as "no proxy".
httpProxy: "${HTTP_PROXY:-}"
httpsProxy: "${HTTPS_PROXY:-}"
